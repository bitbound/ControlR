name: Build Windows Bundle
description: >
  Publishes the Windows DesktopClient, Agent, and Installer, signs all
  artifacts in one Azure Key Vault pass, and stages the bundle ZIP in the
  downloads directory.

inputs:
  source-dir:
    description: 'Path to the ControlR repo checkout, relative to the workspace (e.g. "." or a submodule path)'
    required: false
    default: '.'
  arch:
    description: 'Target RID (win-x86 or win-x64)'
    required: true
  version:
    description: 'Build version used for -p:Version and -p:FileVersion'
    required: true
  azure-client-id:
    description: 'Azure AD application client ID for OIDC login'
    required: true
  azure-tenant-id:
    description: 'Azure tenant ID for OIDC login'
    required: true
  azure-subscription-id:
    description: 'Azure subscription ID for OIDC login'
    required: true
  azure-key-vault-uri:
    description: 'Azure Key Vault URI containing signing certificate'
    required: true
  azure-key-vault-certificate-name:
    description: 'Azure Key Vault certificate name used for signing'
    required: true
  signing-description-url:
    description: 'Description URL embedded in signed binaries'
    required: true
  timestamp-url:
    description: 'RFC3161 timestamp URL'
    required: false
    default: 'http://timestamp.digicert.com'

runs:
  using: composite
  steps:
    - name: Resolve source directory
      shell: pwsh
      run: |
        $src = Join-Path $env:GITHUB_WORKSPACE '${{ inputs.source-dir }}'
        $src = (Resolve-Path $src).Path
        "SRC_DIR=$src" >> $env:GITHUB_ENV

    - name: Publish DesktopClient (${{ inputs.arch }})
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        dotnet publish "$env:SRC_DIR\ControlR.DesktopClient" -c Release -f net10.0-windows8.0 -r ${{ inputs.arch }} --self-contained -o "$env:SRC_DIR\ControlR.DesktopClient\bin\publish\${{ inputs.arch }}" -p:Version=$env:VERSION -p:FileVersion=$env:VERSION

    - name: Publish Agent (${{ inputs.arch }})
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        $agentPublishDir = "$env:SRC_DIR\ControlR.Agent\bin\publish\${{ inputs.arch }}"
        New-Item -Path $agentPublishDir -ItemType Directory -Force | Out-Null
        New-Item -Path "$env:SRC_DIR\ControlR.Web.Server\wwwroot\downloads\${{ inputs.arch }}" -ItemType Directory -Force | Out-Null
        dotnet publish "$env:SRC_DIR\ControlR.Agent" -c Release -r ${{ inputs.arch }} -o $agentPublishDir -p:PublishSingleFile=true -p:UseAppHost=true -p:Version=$env:VERSION -p:FileVersion=$env:VERSION -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:IncludeAppSettingsInSingleFile=true -p:DebugType=none

    - name: Publish Installer (${{ inputs.arch }})
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        dotnet publish "$env:SRC_DIR\ControlR.Agent.Installer" -c Release -r ${{ inputs.arch }} --self-contained -o "$env:SRC_DIR\ControlR.Web.Server\wwwroot\downloads\${{ inputs.arch }}" -p:PublishSingleFile=true -p:UseAppHost=true -p:EnableCompressionInSingleFile=true -p:Version=$env:VERSION -p:FileVersion=$env:VERSION -p:DebugType=none

    - name: Azure Login
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Install AzureSignTool
      shell: pwsh
      run: |
        dotnet tool update --global AzureSignTool
        if ($LASTEXITCODE -ne 0) {
          dotnet tool install --global AzureSignTool
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        }

    - name: Sign Artifacts (${{ inputs.arch }})
      shell: pwsh
      env:
        SIGNING_DESCRIPTION_URL: ${{ inputs.signing-description-url }}
        AZURE_KEY_VAULT_URI: ${{ inputs.azure-key-vault-uri }}
        AZURE_KEY_VAULT_CERTIFICATE_NAME: ${{ inputs.azure-key-vault-certificate-name }}
        TIMESTAMP_URL: ${{ inputs.timestamp-url }}
      run: |
        $desktopDir = "$env:SRC_DIR\ControlR.DesktopClient\bin\publish\${{ inputs.arch }}"
        $agentExe = "$env:SRC_DIR\ControlR.Agent\bin\publish\${{ inputs.arch }}\$env:BRAND_KEY.Agent.exe"
        $installerExe = "$env:SRC_DIR\ControlR.Web.Server\wwwroot\downloads\${{ inputs.arch }}\$env:BRAND_KEY.Agent.Installer.exe"

        dnx azuresigntool --yes sign `
          --du="$env:SIGNING_DESCRIPTION_URL" `
          --fd=sha256 `
          --kvu="$env:AZURE_KEY_VAULT_URI" `
          --kvc="$env:AZURE_KEY_VAULT_CERTIFICATE_NAME" `
          --kvm `
          --tr="$env:TIMESTAMP_URL" `
          --td=sha256 `
          --skip-signed `
          "$desktopDir\*.exe" "$desktopDir\*.dll" "$agentExe" "$installerExe"

    - name: Package and Prepare DesktopClient (${{ inputs.arch }})
      shell: pwsh
      run: |
        # Create staging directory
        $stagingDir = Join-Path $env:RUNNER_TEMP "staging-desktop/${{ inputs.arch }}"
        New-Item -Path $stagingDir -ItemType Directory -Force | Out-Null

        # Create ZIP
        Compress-Archive -Path "$env:SRC_DIR\ControlR.DesktopClient\bin\publish\${{ inputs.arch }}\*" -DestinationPath (Join-Path $stagingDir "$env:BRAND_KEY.DesktopClient.zip") -Force

    - name: Create Bundle ZIP (${{ inputs.arch }})
      shell: pwsh
      run: |
        $agentPublishDir = "$env:SRC_DIR\ControlR.Agent\bin\publish\${{ inputs.arch }}"
        $bundleDir = Join-Path $env:RUNNER_TEMP "bundle/${{ inputs.arch }}"
        $desktopDir = Join-Path $bundleDir "DesktopClient"
        Remove-Item -Path $bundleDir -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -Path $desktopDir -ItemType Directory -Force | Out-Null

        Copy-Item (Join-Path $agentPublishDir "$env:BRAND_KEY.Agent.exe") (Join-Path $bundleDir "$env:BRAND_KEY.Agent.exe") -Force
        Copy-Item "$env:SRC_DIR\ControlR.DesktopClient\bin\publish\${{ inputs.arch }}\*" $desktopDir -Recurse -Force

        Compress-Archive -Path "$bundleDir\*" -DestinationPath "$env:SRC_DIR\ControlR.Web.Server\wwwroot\downloads\${{ inputs.arch }}\$env:BRAND_KEY.Agent.bundle.zip" -Force
