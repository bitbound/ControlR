name: Get Build Prerelease Flag
description: Reads the prerelease flag recorded in a Server artifact by build.yml, falling back when the artifact predates it

# build.yml writes Prerelease.txt at the root of the Server artifact so publication can
# never mislabel a build. Artifacts built before that file existed fall back to the
# caller's value.

inputs:
  path:
    description: 'Path to the downloaded Server artifact root (the directory holding Prerelease.txt)'
    required: true
  fallback:
    description: 'true/false value to use when the artifact has no Prerelease.txt'
    required: true

outputs:
  prerelease:
    description: 'The resolved prerelease flag, true or false.'
    value: ${{ steps.read.outputs.prerelease }}

runs:
  using: composite
  steps:
    - name: Read Prerelease Metadata
      id: read
      shell: bash
      env:
        METADATA_FILE: ${{ inputs.path }}/Prerelease.txt
        FALLBACK: ${{ inputs.fallback }}
      run: |
        set -euo pipefail

        PRERELEASE="$FALLBACK"
        if [ -f "$METADATA_FILE" ]; then
          PRERELEASE=$(tr -d '\r\n' < "$METADATA_FILE" | tr '[:upper:]' '[:lower:]')
        fi

        case "$PRERELEASE" in
          true|false) ;;
          *)
            echo "::error::Invalid prerelease value '$PRERELEASE' (metadata: $METADATA_FILE, fallback: '$FALLBACK')."
            exit 1
            ;;
        esac

        echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
