name: Verify Server Payload
description: Verifies that a downloaded Server artifact still contains the files the web server embeds

# build.yml verifies its own publish output before uploading, but that cannot detect a
# truncated or incomplete artifact download. An incomplete payload fails silently
# downstream: "COPY ${TARGETARCH}/ /app" succeeds for any directory, and the release ZIPs
# are built from whatever is present. Both would publish a broken artifact without error.

inputs:
  path:
    description: 'Path to the downloaded payload root (the directory holding one subdirectory per runtime)'
    required: true

runs:
  using: composite
  steps:
    - name: Verify Server Payload
      shell: pwsh
      env:
        PAYLOAD: ${{ inputs.path }}
      run: |
        $Payload = $env:PAYLOAD
        if (-not (Test-Path -PathType Container $Payload)) {
          throw "'$Payload' does not exist. Re-run the Build workflow."
        }

        # Static assets the server serves directly.
        $StaticPaths = @(
          'wwwroot/downloads/Version.txt',
          'wwwroot/downloads/release-notes.md',
          'wwwroot/lib/monaco-editor/min/vs/editor/editor.main.js',
          'novnc/vnc.html'
        )

        # Platform directories holding the agent installers users download.
        $Platforms = @('win-x86', 'win-x64', 'linux-x64', 'osx-arm64', 'osx-x64')

        $RuntimeDirs = @(Get-ChildItem -Path $Payload -Directory)
        if ($RuntimeDirs.Count -eq 0) {
          throw "'$Payload' contains no runtime directories."
        }

        $Failures = [System.Collections.Generic.List[string]]::new()

        foreach ($RuntimeDir in $RuntimeDirs) {
          $Runtime = $RuntimeDir.Name
          $RuntimeFailures = [System.Collections.Generic.List[string]]::new()

          foreach ($StaticPath in $StaticPaths) {
            if (-not (Test-Path -PathType Leaf (Join-Path $RuntimeDir.FullName $StaticPath))) {
              $RuntimeFailures.Add("$Runtime is missing $StaticPath.")
            }
          }

          foreach ($Platform in $Platforms) {
            $DownloadDir = Join-Path $RuntimeDir.FullName "wwwroot/downloads/$Platform"

            # The installer file name carries the brand key, so match on the suffix.
            $Installers = @(Get-ChildItem -Path $DownloadDir -Filter '*.Agent.Installer*' -File -ErrorAction SilentlyContinue)
            $Bundles = @(Get-ChildItem -Path $DownloadDir -Filter '*.Agent.bundle.zip' -File -ErrorAction SilentlyContinue)

            if ($Installers.Count -eq 0) {
              $RuntimeFailures.Add("$Runtime is missing the $Platform agent installer.")
            }
            if ($Bundles.Count -eq 0) {
              $RuntimeFailures.Add("$Runtime is missing the $Platform agent bundle.")
            }
          }

          if ($RuntimeFailures.Count -eq 0) {
            Write-Host "Verified $Runtime"
          }

          $Failures.AddRange($RuntimeFailures)
        }

        if ($Failures.Count -gt 0) {
          foreach ($Failure in $Failures) {
            Write-Host "::error::$Failure"
          }
          throw "Server payload verification failed ($($Failures.Count) problem(s) in '$Payload')."
        }

        Write-Host "Server payload verified: $($RuntimeDirs.Count) runtime(s) in $Payload"
