name: Build, Sign, and Pack NuGets

on:
  workflow_call:
    inputs:
      version:
        description: Version number for package metadata
        required: true
        type: string
      retention-days:
        description: Number of days to retain artifact
        required: false
        default: 1
        type: number
      prerelease:
        description: Whether to append -dev prerelease suffix
        required: false
        default: false
        type: boolean
      use_self_hosted_runners:
        description: Use self-hosted Windows runners
        required: false
        default: true
        type: boolean
      use_local_storage:
        description: Use local artifact storage
        required: false
        default: true
        type: boolean

jobs:
  build-sign-pack:
    name: Build, Sign and Pack NuGets
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Windows"]') || fromJson('["windows-latest"]') }}
    environment: ${{ github.repository == 'bitbound/ControlR' && 'production' || 'development' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore Package Projects
        shell: pwsh
        run: |
          dotnet restore Build/ControlR.Packages.slnf

      - name: Build Package Projects
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          dotnet build Build/ControlR.Packages.slnf -c Release --no-restore -p:FileVersion="$env:VERSION" -p:AssemblyVersion="$env:VERSION"

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install AzureSignTool
        shell: pwsh
        run: |
          dotnet tool update --global AzureSignTool
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install --global AzureSignTool
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Sign and Pack NuGets
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          SIGNING_DESCRIPTION_URL: ${{ vars.SIGNING_DESCRIPTION_URL }}
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERTIFICATE_NAME: ${{ secrets.AZURE_KEY_VAULT_CERTIFICATE_NAME }}
        run: |
          $packagesFilter = Get-Content -Raw 'Build/ControlR.Packages.slnf' | ConvertFrom-Json
          $projectPaths = @($packagesFilter.solution.projects)

          if ($projectPaths.Count -eq 0) {
            Write-Error "No projects found in Build/ControlR.Packages.slnf"
            exit 1
          }

          # Create a single flat output directory for all packages
          $flatOutputDir = Join-Path (Get-Location) 'nuget-packages'
          New-Item -Path $flatOutputDir -ItemType Directory -Force | Out-Null

          foreach ($projectPath in $projectPaths) {
            $projectFullPath = (Resolve-Path $projectPath.Replace('\', '/')).Path
            $projectDir = Split-Path -Parent $projectFullPath
            $projectName = [System.IO.Path]::GetFileNameWithoutExtension($projectFullPath)
            $packageOutputDir = Join-Path (Join-Path (Join-Path $projectDir 'bin') 'Release') 'packages'

            # Determine package version
            $PackageVersion = $env:VERSION
            if ($env:PRERELEASE -eq "true") {
              $PackageVersion += "-dev"
            }

            Write-Host "Processing $projectName..."

            # Sign the DLL
            $signPattern = Join-Path (Join-Path (Join-Path (Join-Path $projectDir 'bin') 'Release') '**') "$projectName.dll"
            dnx azuresigntool --yes sign `
              --du="$env:SIGNING_DESCRIPTION_URL" `
              --fd=sha256 `
              --kvu="$env:AZURE_KEY_VAULT_URI" `
              --kvc="$env:AZURE_KEY_VAULT_CERTIFICATE_NAME" `
              --kvm `
              --tr=http://timestamp.digicert.com `
              --td=sha256 `
              --skip-signed `
              $signPattern

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to sign $projectName"
              exit $LASTEXITCODE
            }

            # Create package output directory
            New-Item -Path $packageOutputDir -ItemType Directory -Force | Out-Null

            # Pack the NuGet package
            dotnet pack $projectFullPath -c Release --no-build `
              -p:FileVersion="$env:VERSION" `
              -p:AssemblyVersion="$env:VERSION" `
              -p:PackageVersion="$PackageVersion" `
              -o $packageOutputDir

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to pack $projectName"
              exit $LASTEXITCODE
            }

            # Copy packages to flat output directory
            Copy-Item -Path (Join-Path $packageOutputDir '*.nupkg') -Destination $flatOutputDir -Force
            Copy-Item -Path (Join-Path $packageOutputDir '*.snupkg') -Destination $flatOutputDir -Force

            Write-Host "Copied $projectName packages to flat output directory"
          }

      - name: Upload NuGet Packages
        uses: ./.github/actions/upload-artifact
        with:
          name: NuGetPackages
          path: nuget-packages
          retention-days: ${{ inputs.retention-days }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}