name: Publish to Docker Hub
run-name: Docker Publish (${{ inputs.docker_tag }} - ${{ inputs.run_id || 'latest build' }})

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker tag to publish"
        required: true
        type: choice
        options:
          - dev
          - preview
          - latest
        default: "dev"
      run_id:
        description: "Build workflow run ID (leave empty to use latest)"
        required: false
        type: string
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      docker_tag:
        description: "Docker tag to publish"
        required: true
        type: string
      run_id:
        description: "Build workflow run ID (leave empty to use latest)"
        required: false
        type: string
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Publish to Docker Hub
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate local storage configuration
        uses: ./.github/actions/validate-local-storage
        with:
          use_local_storage: ${{ inputs.use_local_storage }}
          artifact_host: ${{ vars.ARTIFACT_HOST }}
          artifact_base_path: ${{ vars.ARTIFACT_BASE_PATH }}
      - name: Get Latest Build Run ID
        id: get-run-id
        uses: ./.github/actions/get-latest-build-run-id
        with:
          run_id: ${{ inputs.run_id }}
          github_token: ${{ github.token }}

      - name: Download Server Artifact
        uses: ./.github/actions/download-artifact
        with:
          name: Server
          path: ./server-publish
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          run-id: ${{ steps.get-run-id.outputs.run_id }}

      - name: Verify Server Payload
        uses: ./.github/actions/verify-server-payload
        with:
          path: ./server-publish

      # The Server artifact holds one subdirectory per runtime the build produced, so the
      # archive itself is the record of what to publish. Nothing here re-reads the build's
      # inputs.
      - name: Prepare Docker Context
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./payload
          PLATFORMS=
          VERSION=
          for PAIR in amd64:linux-x64 arm64:linux-arm64; do
            ARCH="${PAIR%%:*}"
            RID="${PAIR##*:}"
            [ -d "./server-publish/$RID" ] || continue

            cp -R "./server-publish/$RID" "./payload/$ARCH"
            PLATFORMS="${PLATFORMS:+$PLATFORMS,}linux/$ARCH"
            [ -n "$VERSION" ] || VERSION=$(tr -d '\r\n' < "./server-publish/$RID/wwwroot/downloads/Version.txt")
            echo "linux/$ARCH <- $RID"
          done

          [ -n "$PLATFORMS" ] || { echo "::error::No Linux payload in the Server artifact."; exit 1; }
          [ -n "$VERSION" ] || { echo "::error::Version.txt is empty."; exit 1; }

          { echo "version=$VERSION"; echo "platforms=$PLATFORMS"; } >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          echo "Platforms: $PLATFORMS"

      - name: Create Dockerfile
        shell: bash
        run: |
          cat > ./payload/Dockerfile << 'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:10.0
          RUN apt update
          RUN apt -y install curl

          USER $APP_UID
          WORKDIR /app
          EXPOSE 8080
          EXPOSE 8081

          # Each runtime is unpacked under its Docker architecture name.
          ARG TARGETARCH
          COPY ${TARGETARCH}/ /app

          ENTRYPOINT ["dotnet", "ControlR.Web.Server.dll"]

          HEALTHCHECK \
            CMD curl -f http://localhost:8080/health || exit 1
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Harmless when the runner's own architecture is the only target.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: ./payload
          file: ./payload/Dockerfile
          push: true
          platforms: ${{ steps.payload.outputs.platforms }}
          tags: |
            bitbound/controlr:${{ inputs.docker_tag }}
            bitbound/controlr:${{ steps.payload.outputs.version }}

      - name: Image Published
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.payload.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** ${{ steps.payload.outputs.platforms }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "- bitbound/controlr:${{ inputs.docker_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- bitbound/controlr:${{ steps.payload.outputs.version }}" >> $GITHUB_STEP_SUMMARY
