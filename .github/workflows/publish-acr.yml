name: Publish to ACR
run-name: ACR Publish (${{ inputs.sponsor_login }}-slot${{ inputs.slot_number }})

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run ID to publish"
        required: true
        type: string
      sponsor_login:
        description: "Sponsor GitHub login (used as repository prefix)"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: number
      image_reference:
        description: "Full ACR image reference. When provided, overrides the derived reference."
        required: false
        type: string
      server_runtime:
        description: "Server runtime the image content was built for"
        required: false
        type: choice
        default: "linux-x64"
        options:
          - linux-x64
          - linux-arm64
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true
      environment:
        description: "Target environment (dev or prod)"
        required: false
        type: choice
        default: "dev"
        options:
          - dev
          - prod
  workflow_call:
    inputs:
      run_id:
        description: "Build workflow run ID to publish"
        required: true
        type: string
      sponsor_login:
        description: "Sponsor GitHub login (used as repository prefix)"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: string
      image_reference:
        description: "Full ACR image reference. When provided, overrides the derived reference."
        required: false
        type: string
      server_runtime:
        description: "Server runtime the image content was built for"
        required: false
        type: string
        default: "linux-x64"
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true
      environment:
        description: "Target environment (dev or prod)"
        required: false
        type: string
        default: "dev"

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to ACR
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}
    environment: ${{ inputs.environment == 'prod' && 'acr-publish-prod' || 'acr-publish-dev' }}

    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      SPONSOR_LOGIN: ${{ inputs.sponsor_login }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve image platform
        id: platform
        shell: pwsh
        env:
          SERVER_RID: ${{ inputs.server_runtime }}
        run: |
          $PlatformsByRid = @{
            'linux-x64'   = 'linux/amd64'
            'linux-arm64' = 'linux/arm64'
          }

          $Platform = $PlatformsByRid[$env:SERVER_RID]
          if (-not $Platform) {
            throw "'$env:SERVER_RID' is not a supported server runtime. Expected linux-x64 or linux-arm64."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "platform=$Platform"
          Write-Host "Platform: $Platform"

      - name: Set up QEMU
        if: steps.platform.outputs.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Validate local storage configuration
        uses: ./.github/actions/validate-local-storage
        with:
          use_local_storage: ${{ inputs.use_local_storage }}
          artifact_host: ${{ vars.ARTIFACT_HOST }}
          artifact_base_path: ${{ vars.ARTIFACT_BASE_PATH }}

      - name: Normalize sponsor login
        id: normalize
        shell: pwsh
        run: |
          $Normalized = "$env:SPONSOR_LOGIN".ToLowerInvariant() -replace '[^a-z0-9._-]', '-'
          $Normalized = $Normalized -replace '^-', ''
          $Normalized = $Normalized -replace '-$', ''
          if (-not $Normalized) {
            $Normalized = 'sponsor'
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "normalized=$Normalized"
          Write-Host "Normalized sponsor login: $Normalized"

      - name: Resolve image reference
        id: image-ref
        shell: pwsh
        env:
          IMAGE_REF_INPUT: ${{ inputs.image_reference }}
          SLOT_NUMBER: ${{ inputs.slot_number }}
          NORMALIZED: ${{ steps.normalize.outputs.normalized }}
        run: |
          $ImageRef = if ($env:IMAGE_REF_INPUT) {
            $env:IMAGE_REF_INPUT
          }
          else {
            "$env:ACR_LOGIN_SERVER/$env:NORMALIZED/controlr:$env:NORMALIZED-slot$env:SLOT_NUMBER"
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "ref=$ImageRef"
          Write-Host "Image reference: $ImageRef"

      - name: Download Server Artifact
        uses: ./.github/actions/download-artifact
        with:
          name: Server
          path: ./server-publish
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          run-id: ${{ inputs.run_id }}

      - name: Get Build Metadata
        id: metadata
        uses: ./.github/actions/get-build-metadata
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          expected-rid: ${{ inputs.server_runtime }}

      # Download the customization config (uploaded by build.yml download-customization
      # job) so the brand name and other properties are available for the publish steps.
      # Only present when a customization config URL was supplied; default brand "ControlR"
      # is used otherwise.
      - name: Download Customization Config
        id: download-customization
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: CustomizationConfig
          path: ./customization
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          run-id: ${{ inputs.run_id }}

      - name: Resolve Brand Key
        id: brand
        shell: pwsh
        run: |
          $BrandName = 'ControlR'
          $CustomizationFile = './customization/customization.json'
          if (Test-Path -PathType Leaf $CustomizationFile) {
            $BrandName = (Get-Content -Path $CustomizationFile -Raw | ConvertFrom-Json).brandName
          }

          if (-not $BrandName -or $BrandName -eq 'null') {
            $BrandName = 'ControlR'
          }

          # Mirrors Invoke-Customize.ps1 sanitization: keep only alphanumerics, others -> '_'
          $BrandKey = $BrandName -replace '[^A-Za-z0-9]', '_'

          Add-Content -Path $env:GITHUB_OUTPUT -Value "brand_name=$BrandName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "brand_key=$BrandKey"
          Write-Host "Brand name: $BrandName"
          Write-Host "Brand key: $BrandKey"

      - name: Verify Downloaded Files
        shell: pwsh
        env:
          BRAND_KEY: ${{ steps.brand.outputs.brand_key }}
          SERVER_RID: ${{ inputs.server_runtime }}
        run: |
          $Rid = $env:SERVER_RID
          $BrandKey = $env:BRAND_KEY
          $RequiredPaths = @(
            "./server-publish/$Rid/wwwroot/downloads/Version.txt",
            "./server-publish/$Rid/wwwroot/downloads/linux-x64/$BrandKey.Agent.Installer",
            "./server-publish/$Rid/wwwroot/downloads/linux-x64/$BrandKey.Agent.bundle.zip",
            "./server-publish/$Rid/novnc/vnc.html"
          )

          $Missing = @($RequiredPaths | Where-Object { -not (Test-Path -Path $_) })
          if ($Missing) {
            throw "Missing from the Server artifact: $($Missing -join ', ')."
          }

          Write-Host "All required files verified successfully"

      - name: Create Custom Dockerfile
        shell: pwsh
        env:
          SERVER_RID: ${{ inputs.server_runtime }}
        run: |
          @'
          FROM mcr.microsoft.com/dotnet/aspnet:10.0
          RUN apt-get update \
              && apt-get install -y --no-install-recommends curl \
              && rm -rf /var/lib/apt/lists/*

          ARG CURRENT_VERSION=unknown
          ARG SPONSOR_LOGIN=unknown
          ARG SLOT_NUMBER=0

          LABEL org.opencontainers.image.version="${CURRENT_VERSION}" \
                controlr.sponsor="${SPONSOR_LOGIN}" \
                controlr.slot="${SLOT_NUMBER}"

          USER $APP_UID
          WORKDIR /app
          EXPOSE 8080
          EXPOSE 8081

          COPY . /app

          ENTRYPOINT ["dotnet", "ControlR.Web.Server.dll"]

          HEALTHCHECK \
            CMD curl -f http://localhost:8080/health || exit 1
          '@ | Set-Content -Path "./server-publish/$env:SERVER_RID/Dockerfile" -Encoding utf8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_ACR_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        shell: pwsh
        run: |
          az acr login --name $env:ACR_LOGIN_SERVER

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./server-publish/${{ inputs.server_runtime }}
          file: ./server-publish/${{ inputs.server_runtime }}/Dockerfile
          push: true
          platforms: ${{ steps.platform.outputs.platform }}
          tags: ${{ steps.image-ref.outputs.ref }}
          provenance: true
          sbom: true
          build-args: |
            CURRENT_VERSION=${{ steps.metadata.outputs.release_version }}
            SPONSOR_LOGIN=${{ steps.normalize.outputs.normalized }}
            SLOT_NUMBER=${{ inputs.slot_number }}

      - name: Image Published
        shell: pwsh
        env:
          SPONSOR: ${{ inputs.sponsor_login }}
          SLOT: ${{ inputs.slot_number }}
          VERSION: ${{ steps.metadata.outputs.release_version }}
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          $Summary = @(
            "## ACR Publish Summary",
            "**Sponsor:** $env:SPONSOR",
            "**Slot:** $env:SLOT",
            "**Version:** $env:VERSION",
            "**Image:** $env:IMAGE_REF",
            "**Build Run:** $env:RUN_ID"
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $Summary
