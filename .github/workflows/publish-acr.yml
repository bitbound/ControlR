name: Publish to ACR
run-name: ACR Publish (${{ inputs.sponsor_login }}-slot${{ inputs.slot_number }})

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run ID to publish"
        required: true
        type: string
      sponsor_login:
        description: "Sponsor GitHub login (used as repository prefix)"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: number
      image_reference:
        description: "Full ACR image reference. When provided, overrides the derived reference."
        required: false
        type: string
      server_runtime:
        description: "Server runtime the image content was built for"
        required: false
        type: choice
        default: "linux-x64"
        options:
          - linux-x64
          - linux-arm64
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true
      environment:
        description: "Target environment (dev or prod)"
        required: false
        type: choice
        default: "dev"
        options:
          - dev
          - prod
  workflow_call:
    inputs:
      run_id:
        description: "Build workflow run ID to publish"
        required: true
        type: string
      sponsor_login:
        description: "Sponsor GitHub login (used as repository prefix)"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: string
      image_reference:
        description: "Full ACR image reference. When provided, overrides the derived reference."
        required: false
        type: string
      server_runtime:
        description: "Server runtime the image content was built for"
        required: false
        type: string
        default: "linux-x64"
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true
      environment:
        description: "Target environment (dev or prod)"
        required: false
        type: string
        default: "dev"

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to ACR
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}
    environment: ${{ inputs.environment == 'prod' && 'acr-publish-prod' || 'acr-publish-dev' }}

    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      SPONSOR_LOGIN: ${{ inputs.sponsor_login }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve image platform
        id: platform
        shell: bash
        run: |
          case "${{ inputs.server_runtime }}" in
            linux-x64)   echo "platform=linux/amd64" >> "$GITHUB_OUTPUT" ;;
            linux-arm64) echo "platform=linux/arm64" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unsupported server runtime '${{ inputs.server_runtime }}'. Expected linux-x64 or linux-arm64."
              exit 1
              ;;
          esac

      - name: Set up QEMU
        if: steps.platform.outputs.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Validate local storage configuration
        uses: ./.github/actions/validate-local-storage
        with:
          use_local_storage: ${{ inputs.use_local_storage }}
          artifact_host: ${{ vars.ARTIFACT_HOST }}
          artifact_base_path: ${{ vars.ARTIFACT_BASE_PATH }}

      - name: Normalize sponsor login
        id: normalize
        shell: bash
        run: |
          NORMALIZED=$(echo "$SPONSOR_LOGIN" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$NORMALIZED" ]; then
            NORMALIZED="sponsor"
          fi
          echo "normalized=$NORMALIZED" >> $GITHUB_OUTPUT
          echo "Normalized sponsor login: $NORMALIZED"

      - name: Resolve image reference
        id: image-ref
        shell: bash
        env:
          IMAGE_REF_INPUT: ${{ inputs.image_reference }}
          SLOT_NUMBER: ${{ inputs.slot_number }}
          NORMALIZED: ${{ steps.normalize.outputs.normalized }}
        run: |
          if [ -n "$IMAGE_REF_INPUT" ]; then
            IMAGE_REF="$IMAGE_REF_INPUT"
          else
            IMAGE_REF="$ACR_LOGIN_SERVER/$NORMALIZED/controlr:$NORMALIZED-slot$SLOT_NUMBER"
          fi
          echo "ref=$IMAGE_REF" >> $GITHUB_OUTPUT
          echo "Image reference: $IMAGE_REF"

      - name: Download Server Artifact
        uses: ./.github/actions/download-artifact
        with:
          name: Server
          path: ./server-publish
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          run-id: ${{ inputs.run_id }}

      - name: Get Version from Version.txt
        id: get-version
        shell: bash
        env:
          SERVER_RID: ${{ inputs.server_runtime }}
        run: |
          VERSION=$(cat "./server-publish/${SERVER_RID}/wwwroot/downloads/Version.txt")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # Download the customization config (uploaded by build.yml download-customization
      # job) so the brand name and other properties are available for the publish steps.
      # Only present when a customization config URL was supplied; default brand "ControlR"
      # is used otherwise.
      - name: Download Customization Config
        id: download-customization
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: CustomizationConfig
          path: ./customization
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          run-id: ${{ inputs.run_id }}

      - name: Resolve Brand Key
        id: brand
        shell: bash
        run: |
          BRAND_NAME="ControlR"
          if [ -f "./customization/customization.json" ]; then
            BRAND_NAME=$(jq -r '.brandName // "ControlR"' ./customization/customization.json)
          fi
          if [ -z "$BRAND_NAME" ] || [ "$BRAND_NAME" = "null" ]; then
            BRAND_NAME="ControlR"
          fi
          # Mirrors Invoke-Customize.ps1 sanitization: keep only alphanumerics, others -> '_'
          BRAND_KEY=$(printf '%s' "$BRAND_NAME" | sed 's/[^A-Za-z0-9]/_/g')
          echo "brand_name=$BRAND_NAME" >> $GITHUB_OUTPUT
          echo "brand_key=$BRAND_KEY" >> $GITHUB_OUTPUT
          echo "Brand name: $BRAND_NAME"
          echo "Brand key: $BRAND_KEY"

      - name: Verify Downloaded Files
        shell: bash
        env:
          BRAND_KEY: ${{ steps.brand.outputs.brand_key }}
          SERVER_RID: ${{ inputs.server_runtime }}
        run: |
          set -euo pipefail

          TEST_PATHS=(
            "./server-publish/${SERVER_RID}/wwwroot/downloads/Version.txt"
            "./server-publish/${SERVER_RID}/wwwroot/downloads/linux-x64/${BRAND_KEY}.Agent.Installer"
            "./server-publish/${SERVER_RID}/wwwroot/downloads/linux-x64/${BRAND_KEY}.Agent.bundle.zip"
            "./server-publish/${SERVER_RID}/novnc/vnc.html"
          )

          for TEST_PATH in "${TEST_PATHS[@]}"; do
            if [ ! -f "$TEST_PATH" ] && [ ! -d "$TEST_PATH" ]; then
              echo "::error::$TEST_PATH not found."
              exit 1
            fi
          done
          echo "All required files verified successfully"

      - name: Create Custom Dockerfile
        shell: bash
        env:
          SERVER_RID: ${{ inputs.server_runtime }}
        run: |
          cat > "./server-publish/${SERVER_RID}/Dockerfile" << 'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:10.0
          RUN apt-get update \
              && apt-get install -y --no-install-recommends curl \
              && rm -rf /var/lib/apt/lists/*

          ARG CURRENT_VERSION=unknown
          ARG SPONSOR_LOGIN=unknown
          ARG SLOT_NUMBER=0

          LABEL org.opencontainers.image.version="${CURRENT_VERSION}" \
                controlr.sponsor="${SPONSOR_LOGIN}" \
                controlr.slot="${SLOT_NUMBER}"

          USER $APP_UID
          WORKDIR /app
          EXPOSE 8080
          EXPOSE 8081

          COPY . /app

          ENTRYPOINT ["dotnet", "ControlR.Web.Server.dll"]

          HEALTHCHECK \
            CMD curl -f http://localhost:8080/health || exit 1
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_ACR_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        shell: bash
        run: |
          az acr login --name "${ACR_LOGIN_SERVER}"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./server-publish/${{ inputs.server_runtime }}
          file: ./server-publish/${{ inputs.server_runtime }}/Dockerfile
          push: true
          platforms: ${{ steps.platform.outputs.platform }}
          tags: ${{ steps.image-ref.outputs.ref }}
          provenance: true
          sbom: true
          build-args: |
            CURRENT_VERSION=${{ steps.get-version.outputs.VERSION }}
            SPONSOR_LOGIN=${{ steps.normalize.outputs.normalized }}
            SLOT_NUMBER=${{ inputs.slot_number }}

      - name: Image Published
        shell: bash
        env:
          SPONSOR: ${{ inputs.sponsor_login }}
          SLOT: ${{ inputs.slot_number }}
          VERSION: ${{ steps.get-version.outputs.VERSION }}
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          echo "## ACR Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Sponsor:** $SPONSOR" >> $GITHUB_STEP_SUMMARY
          echo "**Slot:** $SLOT" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** $IMAGE_REF" >> $GITHUB_STEP_SUMMARY
          echo "**Build Run:** $RUN_ID" >> $GITHUB_STEP_SUMMARY
