name: Sync Release Tag

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to sync, for replaying a missed publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-tag:
    name: Copy the release tag to the target repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the released tag and its archive commit are present.
          fetch-depth: 0
          persist-credentials: false

      - name: Mint a token for the target repositories
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GITHUB_APP_ID }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          owner: bitbound
          repositories: ControlR-dev, controlr-portal-builds

      - name: Push the tag and its commit to ControlR-dev
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} is not present in the checkout."
            exit 1
          fi

          git push "https://x-access-token:${TOKEN}@github.com/bitbound/ControlR-dev.git" \
            "refs/tags/${TAG}"

      - name: Mirror the release into controlr-portal-builds
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} is not present in the checkout."
            exit 1
          fi

          git push "https://x-access-token:${TOKEN}@github.com/bitbound/controlr-portal-builds.git" \
            "refs/tags/${TAG}"

          # Keep the default branch pointing at the latest release commit.
          git push "https://x-access-token:${TOKEN}@github.com/bitbound/controlr-portal-builds.git" \
            "HEAD:refs/heads/main" --force
