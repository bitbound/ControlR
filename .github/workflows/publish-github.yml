name: Publish GitHub Release
run-name: "GitHub Release (Run ID: ${{ inputs.run_id || 'latest build' }})"

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release"
        required: true
        type: boolean
        default: false
      run_id:
        description: "Build workflow run ID (leave empty to use latest)"
        required: false
        type: string
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      prerelease:
        description: "Mark as pre-release"
        required: true
        type: boolean
        default: false
      run_id:
        description: "Build workflow run ID (leave empty to use latest)"
        required: false
        type: string
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BBB_CLIENT_ID }}
          private-key: ${{ secrets.BBB_PRIVATE_KEY }}

      - name: Validate local storage configuration
        uses: ./.github/actions/validate-local-storage
        with:
          use_local_storage: ${{ inputs.use_local_storage }}
          artifact_host: ${{ vars.ARTIFACT_HOST }}
          artifact_base_path: ${{ vars.ARTIFACT_BASE_PATH }}
      - name: Get Latest Build Run ID
        id: get-run-id
        uses: ./.github/actions/get-latest-build-run-id
        with:
          run_id: ${{ inputs.run_id }}
          github_token: ${{ github.token }}

      - name: Download Server Artifact
        uses: ./.github/actions/download-artifact
        with:
          name: Server
          path: ./server-publish
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          run-id: ${{ steps.get-run-id.outputs.run_id }}

      - name: Download docker-compose file
        uses: ./.github/actions/download-artifact
        with:
          name: DockerCompose
          path: ./docker-compose-download
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          run-id: ${{ steps.get-run-id.outputs.run_id }}

      - name: Verify Server Payload
        uses: ./.github/actions/verify-server-payload
        with:
          path: ./server-publish

      # The Server artifact holds one subdirectory per runtime the build produced, so the
      # archive itself is the record of what to publish.
      - name: Prepare Release Artifacts
        id: payloads
        shell: bash
        run: |
          set -euo pipefail

          VERSION=
          PRIMARY_RID=
          SUMMARY=
          for PAIR in linux-x64:linux-amd64 linux-arm64:linux-arm64 win-x64:win-x64; do
            RID="${PAIR%%:*}"
            LABEL="${PAIR##*:}"
            [ -d "./server-publish/$RID" ] || continue

            rm -f "server-$LABEL.zip"
            ( cd "./server-publish/$RID" && zip -qr "../../server-$LABEL.zip" . )
            [ -n "$PRIMARY_RID" ] || PRIMARY_RID="$RID"
            [ -n "$VERSION" ] || VERSION=$(tr -d '\r\n' < "./server-publish/$RID/wwwroot/downloads/Version.txt")
            SUMMARY="${SUMMARY}${SUMMARY:+$'\n'}- \`$RID\` -> \`server-$LABEL.zip\`"
            echo "server-$LABEL.zip <- $RID"
          done

          [ -n "$PRIMARY_RID" ] || { echo "::error::No server payload in the Server artifact."; exit 1; }
          [ -n "$VERSION" ] || { echo "::error::Version.txt is empty."; exit 1; }

          cp "./server-publish/$PRIMARY_RID/ControlR.Web.Server_internal.json" .
          cp "./server-publish/$PRIMARY_RID/ControlR.Web.Server_v1.json" .
          cp docker-compose-download/docker-compose.yml .

          { echo "version=$VERSION"; echo "primary_rid=$PRIMARY_RID"; } >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

          {
            echo "## Release Summary"
            echo "**Version:** v$VERSION"
            echo "**Server Runtimes:**"
            printf '%s\n' "$SUMMARY"
            echo "**Status:** Draft"
            echo "**Pre-release:** ${{ inputs.prerelease }}"
            echo ""
            echo "⚠️ Release is in DRAFT mode - review and publish when ready"
          } >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.payloads.outputs.version }} Release
          tag_name: v${{ steps.payloads.outputs.version }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body_path: ./server-publish/${{ steps.payloads.outputs.primary_rid }}/wwwroot/downloads/release-notes.md
          files: |
            server-*.zip
            ControlR.Web.Server_internal.json
            ControlR.Web.Server_v1.json
            docker-compose.yml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Archive Release Notes
        if: ${{ !inputs.prerelease }}
        shell: bash
        env:
          PRIMARY_RID: ${{ steps.payloads.outputs.primary_rid }}
        run: |
          VERSION="${{ steps.payloads.outputs.version }}"
          cp "./server-publish/${PRIMARY_RID}/wwwroot/downloads/release-notes.md" ".release-notes/v${VERSION}.md"
          cat > .release-notes/current.md << 'TEMPLATE'
          ## Breaking Changes

          None.

          ## Enhancements

          None.

          ## Fixes

          None.

          ## Removals

          None.

          ## Internal

          None.
          TEMPLATE
          git config user.name "bitbound-bot[bot]"
          git config user.email "bitbound-bot[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git add .release-notes/
            git commit -m "chore: archive release notes for v${VERSION}"
            git push "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"
          fi
