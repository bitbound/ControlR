name: Publish Slot Server ZIP
run-name: ZIP Publish (${{ inputs.sponsor_login }}-slot${{ inputs.slot_number }})

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run ID whose Server artifact to publish"
        required: true
        type: string
      sponsor_login:
        description: "Sponsor GitHub login (for summary only; the blob key is authoritative)"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: string
      artifact_blob_key:
        description: "Blob key within the slot-builds container, computed by the Subscriber Portal"
        required: true
        type: string
      server_runtime:
        description: "Server runtime the ZIP content was built for"
        required: false
        type: choice
        default: "linux-x64"
        options:
          - linux-x64
          - linux-arm64
          - win-x64
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true
      environment:
        description: "Target environment (dev or prod)"
        required: false
        type: choice
        default: "dev"
        options:
          - dev
          - prod
  workflow_call:
    inputs:
      run_id:
        description: "Build workflow run ID whose Server artifact to publish"
        required: true
        type: string
      sponsor_login:
        description: "Sponsor GitHub login (for summary only; the blob key is authoritative)"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: string
      artifact_blob_key:
        description: "Blob key within the slot-builds container, computed by the Subscriber Portal"
        required: true
        type: string
      server_runtime:
        description: "Server runtime the ZIP content was built for"
        required: false
        type: string
        default: "linux-x64"
      use_local_storage:
        description: "Use local artifact storage"
        required: false
        type: boolean
        default: true
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        type: boolean
        default: true
      environment:
        description: "Target environment (dev or prod)"
        required: false
        type: string
        default: "dev"

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish-zip:
    name: Publish ZIP
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}
    environment: ${{ inputs.environment == 'prod' && 'acr-publish-prod' || 'acr-publish-dev' }}

    env:
      SLOT_ZIP_STORAGE_ACCOUNT: ${{ vars.SLOT_ZIP_STORAGE_ACCOUNT }}
      SLOT_ZIP_CONTAINER: slot-builds

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate blob key
        shell: pwsh
        env:
          BLOB_KEY: ${{ inputs.artifact_blob_key }}
          SPONSOR_LOGIN: ${{ inputs.sponsor_login }}
          SLOT: ${{ inputs.slot_number }}
        run: |
          # Anchored to the whole value with \A and \z so a key containing a newline
          # cannot slip through by matching only on one of its lines.
          if ($env:BLOB_KEY -cnotmatch '(?s)\A[a-z0-9._-]+(/[a-z0-9._-]+)*\.zip\z') {
            throw "artifact_blob_key must be a relative path of [a-z0-9._-] segments separated by '/', ending in .zip."
          }

          if ($env:BLOB_KEY -cmatch '(?s)(\A|/)\.\.(/|\z)') {
            throw "artifact_blob_key must not contain '..' segments."
          }

          # Defense in depth: the key must live under the slot it claims. Mirrors the
          # portal's ContainerRegistryNames.NormalizeSponsorLogin (greedy run collapse).
          $Normalized = ($env:SPONSOR_LOGIN.ToLowerInvariant() -replace '[^a-z0-9._-]+', '-').Trim('-')
          if (-not $Normalized) {
            $Normalized = 'sponsor'
          }

          $Prefix = "$Normalized/slot$env:SLOT/"
          if (-not $env:BLOB_KEY.StartsWith($Prefix, [StringComparison]::Ordinal)) {
            throw "artifact_blob_key '$env:BLOB_KEY' does not start with '$Prefix' for sponsor '$env:SPONSOR_LOGIN' slot $env:SLOT."
          }

          Write-Host "Blob key: $env:BLOB_KEY"

      - name: Validate local storage configuration
        uses: ./.github/actions/validate-local-storage
        with:
          use_local_storage: ${{ inputs.use_local_storage }}
          artifact_host: ${{ vars.ARTIFACT_HOST }}
          artifact_base_path: ${{ vars.ARTIFACT_BASE_PATH }}

      - name: Download Server Artifact
        uses: ./.github/actions/download-artifact
        with:
          name: Server
          path: ./server-publish
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          run-id: ${{ inputs.run_id }}

      - name: Verify Server Payload
        uses: ./.github/actions/verify-server-payload
        with:
          path: ./server-publish

      - name: Get Build Metadata
        id: metadata
        uses: ./.github/actions/get-build-metadata
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}
          expected-rid: ${{ inputs.server_runtime }}

      - name: Create ZIP
        id: make-zip
        shell: pwsh
        env:
          SERVER_RID: ${{ inputs.server_runtime }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $ZipName = "controlr-server-$env:SERVER_RID-$env:VERSION.zip"
          $ZipPath = "./server-publish/$ZipName"
          Remove-Item -Path $ZipPath -Force -ErrorAction SilentlyContinue

          # Zip from inside the runtime directory so the archive root is the payload root.
          Push-Location -Path "./server-publish/$env:SERVER_RID"
          try {
            zip -qr "../$ZipName" .
            if ($LASTEXITCODE -ne 0) {
              throw "zip failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip_path=$ZipPath"
          Write-Host "Created $ZipName ($((Get-Item $ZipPath).Length) bytes)"

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_ACR_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload ZIP to Storage
        shell: pwsh
        env:
          BLOB_KEY: ${{ inputs.artifact_blob_key }}
          ZIP_PATH: ${{ steps.make-zip.outputs.zip_path }}
        run: |
          if (-not $env:SLOT_ZIP_STORAGE_ACCOUNT) {
            throw "SLOT_ZIP_STORAGE_ACCOUNT is not configured for the '${{ inputs.environment }}' environment."
          }

          az storage blob upload `
            --account-name $env:SLOT_ZIP_STORAGE_ACCOUNT `
            --container-name $env:SLOT_ZIP_CONTAINER `
            --name $env:BLOB_KEY `
            --file $env:ZIP_PATH `
            --auth-mode login `
            --content-type application/zip `
            --overwrite `
            --output none

          if ($LASTEXITCODE -ne 0) {
            throw "az storage blob upload failed with exit code $LASTEXITCODE."
          }

          Write-Host "Uploaded to https://$env:SLOT_ZIP_STORAGE_ACCOUNT.blob.core.windows.net/$env:SLOT_ZIP_CONTAINER/$env:BLOB_KEY"

      - name: Publish Summary
        shell: pwsh
        env:
          SPONSOR: ${{ inputs.sponsor_login }}
          SLOT: ${{ inputs.slot_number }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SERVER_RID: ${{ inputs.server_runtime }}
          BLOB_KEY: ${{ inputs.artifact_blob_key }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          $Summary = @(
            "## Slot Server ZIP Publish Summary",
            "**Sponsor:** $env:SPONSOR",
            "**Slot:** $env:SLOT",
            "**Version:** $env:VERSION",
            "**Server RID:** $env:SERVER_RID",
            "**Blob:** $env:SLOT_ZIP_STORAGE_ACCOUNT/$env:SLOT_ZIP_CONTAINER/$env:BLOB_KEY",
            "**Build Run:** $env:RUN_ID"
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $Summary
