name: Build
run-name: Build v${{ inputs.version || vars.CURRENT_VERSION }}

on:
  workflow_dispatch:
    inputs:
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: true
        default: true
        type: boolean

      use_local_storage:
        description: "Use local storage for artifacts"
        required: false
        default: true
        type: boolean

      retention_days_artifacts:
        description: "Retention days for artifacts"
        required: false
        default: 1
        type: number

      version:
        description: "Version number (leave empty for auto)"
        required: false
        default: ""
        type: string

      server_runtime:
        description: "Server target runtime/OS"
        required: false
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - linux-multiarch
          - win-x64

      notarize_mac_bundle:
        description: "Notarize macOS bundle"
        required: false
        default: true
        type: boolean

      build_nugets:
        description: "Build NuGet packages"
        required: false
        default: false
        type: boolean

      prerelease:
        description: "Is prerelease?"
        required: false
        default: false
        type: boolean

      run_tests:
        description: "Run tests"
        required: false
        default: false
        type: boolean

      customization_config_url:
        description: "URL to JSON customization config (empty for default branding)"
        required: false
        default: ""
        type: string

      skip_version_increment:
        description: "Use the supplied version without incrementing or setting the current version."
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      use_self_hosted_runners:
        description: "Use self-hosted runners"
        required: false
        default: true
        type: boolean

      use_local_storage:
        description: "Use local storage for artifacts"
        required: false
        default: true
        type: boolean

      retention_days_artifacts:
        description: "Retention days for artifacts"
        required: false
        default: 1
        type: number

      version:
        description: "Version number"
        required: true
        type: string

      server_runtime:
        description: "Server target runtime/OS"
        required: false
        default: linux-x64
        type: string

      notarize_mac_bundle:
        description: "Notarize macOS bundle"
        required: false
        default: true
        type: boolean

      build_nugets:
        description: "Build NuGet packages"
        required: false
        default: false
        type: boolean

      prerelease:
        description: "Is prerelease?"
        required: false
        default: false
        type: boolean

      run_tests:
        description: "Run tests"
        required: false
        default: false
        type: boolean

      customization_config_url:
        description: "URL to JSON customization config (empty for default branding)"
        required: false
        default: ""
        type: string

      ref:
        description: "Git ref (branch or tag) to build. Defaults to the default branch."
        required: false
        default: ""
        type: string
        
      skip_version_increment:
        description: "Use the supplied version without incrementing or setting the current version."
        required: false
        default: false
        type: boolean

env:
  VERSION: ${{ inputs.version || vars.CURRENT_VERSION }}
  RETENTION_DAYS_ARTIFACTS: ${{ inputs.retention_days_artifacts || 1 }}

jobs:
  set-version:
    name: Increment Version
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}
    permissions:
      contents: read
      actions: write
    outputs:
      version: ${{ steps.setver.outputs.version }}
      prerelease: ${{ steps.setver.outputs.prerelease }}
    env:
      # GITHUB_TOKEN cannot write repository variables. The variables REST endpoints require
      # the "Variables" GitHub App permission, and the workflow `permissions:` key exposes no
      # such grant, so actions: write does not cover `gh variable set`.
      GH_TOKEN: ${{ secrets.GH_VARIABLES_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ inputs.ref || '' }}

      - name: Validate local storage configuration
        uses: ./.github/actions/validate-local-storage
        with:
          use_local_storage: ${{ inputs.use_local_storage }}
          artifact_host: ${{ vars.ARTIFACT_HOST }}
          artifact_base_path: ${{ vars.ARTIFACT_BASE_PATH }}
      - name: Set Next Version
        id: setver
        shell: pwsh
        run: |
          # Use supplied version if provided, otherwise fall back to the repo variable
          if (-not $env:VERSION) {
            Write-Error "VERSION is empty. Provide workflow input version or set CURRENT_VERSION repository variable."
            exit 1
          }

          Write-Host "Using source version: $env:VERSION"

          # A build target may carry a SemVer prerelease suffix (e.g. '0.28.3.0-dev'). .NET
          # versions are strictly numeric, so strip the suffix to get the assembly/file version
          # core and remember that the build was a prerelease.
          $sourceVersion = "$env:VERSION".Trim()
          $suffixIndex = $sourceVersion.IndexOfAny([char[]]@('-', '+'))
          $prereleaseFromVersion = $false
          if ($suffixIndex -ge 0) {
            $prereleaseFromVersion = $sourceVersion[$suffixIndex] -eq '-'
            $sourceVersion = $sourceVersion.Substring(0, $suffixIndex)
          }

          try {
            $CurrentVersion = [System.Version]::Parse($sourceVersion)
          }
          catch {
            Write-Error "VERSION '$env:VERSION' is invalid. Expected a numeric version like 1.2.3 or 1.2.3.0, optionally with a prerelease suffix."
            exit 1
          }

          if ($CurrentVersion.Revision -eq -1) { 
            $CurrentVersion = [System.Version]::new($CurrentVersion.Major, $CurrentVersion.Minor, $CurrentVersion.Build, 0)
          }

          # Prerelease when the version suffix said so, or when the input flag was set.
          $PrereleaseFlag = if ($prereleaseFromVersion -or ("${{ inputs.prerelease }}" -eq "true")) { 'true' } else { 'false' }

          Write-Host "Resolved numeric version: $CurrentVersion"
          Write-Host "Pre-release: $PrereleaseFlag"

          if ("${{ inputs.skip_version_increment }}" -eq "true") {
            Write-Host "skip_version_increment is set. Using version as-is without bumping CURRENT_VERSION."
          }
          else {
            $NextVersion = "$($CurrentVersion.Major).$($CurrentVersion.Minor).$($CurrentVersion.Build + 1).0"
            Write-Host "Next version will be: $NextVersion"
            # Persist next version to GH Variables for future runs
            if ($IsLinux) {
              /usr/bin/gh variable set CURRENT_VERSION --body $NextVersion
            }
            elseif ($IsMacOS) {
              /opt/homebrew/bin/gh variable set CURRENT_VERSION --body $NextVersion
            }
            else {
              gh variable set CURRENT_VERSION --body $NextVersion
            }
          }
          # Expose the current version as a step output for this run
          echo "version=$CurrentVersion" >> $env:GITHUB_OUTPUT
          echo "prerelease=$PrereleaseFlag" >> $env:GITHUB_OUTPUT

  download-customization:
    name: Download Customization Config
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}
    needs: [set-version]
    permissions:
      contents: read
      actions: write
    outputs:
      has_config: ${{ steps.download.outputs.has_config || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ inputs.ref || '' }}

      - name: Download Customization Config
        id: download
        if: inputs.customization_config_url != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configUrl = '${{ inputs.customization_config_url }}'
          $configPath = Join-Path $env:RUNNER_TEMP 'customization.json'
          Write-Host "Downloading customization config from: $configUrl"
          Invoke-WebRequest -Uri $configUrl -OutFile $configPath -UseBasicParsing
          if (-not (Test-Path $configPath)) {
            Write-Error "Failed to download customization config."
            exit 1
          }
          Write-Host "Downloaded customization config to $configPath"
          echo "has_config=true" >> $env:GITHUB_OUTPUT

      - name: Upload Customization Config
        if: inputs.customization_config_url != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: CustomizationConfig
          path: ${{ runner.temp }}/customization.json
          retention-days: ${{ env.RETENTION_DAYS_ARTIFACTS }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

  run-tests:
    name: Run Tests
    needs: set-version
    if: inputs.run_tests
    uses: ./.github/workflows/run-tests.yml
    with:
      use_self_hosted_runners: ${{ inputs.use_self_hosted_runners }}

  build-nugets:
    name: Build NuGet Packages
    needs: [set-version]
    if: inputs.build_nugets
    uses: ./.github/workflows/build-sign-pack-nugets.yml
    with:
      version: ${{ needs.set-version.outputs.version }}
      retention-days: ${{ fromJson(inputs.retention_days_artifacts) }}
      prerelease: ${{ fromJson(needs.set-version.outputs.prerelease) }}
      use_self_hosted_runners: ${{ inputs.use_self_hosted_runners }}
      use_local_storage: ${{ inputs.use_local_storage }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  build-mac-binaries:
    name: Apple Build (${{ matrix.arch }})
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","macOS"]') || fromJson('["macos-26"]') }}
    needs: [set-version, download-customization]
    env:
      # Orphaned MSBuild worker nodes linger on the macOS runners and kill parallel builds (MSB4166).
      MSBUILDDISABLENODEREUSE: "1"
      VERSION: ${{ needs.set-version.outputs.version }}
    strategy:
      matrix:
        arch: [osx-arm64, osx-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ inputs.ref || '' }}

      - name: Select Xcode matching the pinned workload band
        shell: pwsh
        run: ./.scripts/Select-MacOSXcode.ps1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install macOS workload
        run: dotnet workload install macos

      - name: Download Customization Config
        if: needs.download-customization.outputs.has_config == 'true'
        uses: ./.github/actions/download-artifact
        with:
          name: CustomizationConfig
          path: ${{ runner.temp }}/customization
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Apply Branding
        id: branding
        uses: ./.github/actions/apply-branding
        with:
          source-dir: '.'
          customization-config-path: ${{ needs.download-customization.outputs.has_config == 'true' && format('{0}/customization/customization.json', runner.temp) || '' }}
          version: ${{ needs.set-version.outputs.version }}

      - name: Build macOS Bundle (${{ matrix.arch }})
        uses: ./.github/actions/build-mac-bundle
        with:
          source-dir: '.'
          arch: ${{ matrix.arch }}
          version: ${{ needs.set-version.outputs.version }}
          notarize: ${{ inputs.notarize_mac_bundle }}
          cert-p12-base64: ${{ secrets.MACOS_SIGN_CERT_P12 }}
          cert-password: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          sign-identity: ${{ secrets.MACOS_SIGN_IDENTITY }}
          notarize-key-id: ${{ secrets.APPLE_NOTARIZE_KEY_ID }}
          notarize-issuer-id: ${{ secrets.APPLE_NOTARIZE_ISSUER_ID }}
          notarize-key-p8: ${{ secrets.APPLE_NOTARIZE_KEY_P8 }}

      - name: Upload Downloads (${{ matrix.arch }})
        uses: ./.github/actions/upload-artifact
        with:
          name: Downloads-${{ matrix.arch }}
          path: ControlR.Web.Server/wwwroot/downloads/${{ matrix.arch }}/
          retention-days: ${{ env.RETENTION_DAYS_ARTIFACTS }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

  build-windows-binaries:
    name: Windows Build (${{ matrix.arch }})
    # When using self-hosted Windows runners, require both the self-hosted label and OS label.
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Windows"]') || fromJson('["windows-latest"]') }}
    environment: ${{ github.repository == 'bitbound/ControlR' && 'production' || 'development' }}
    needs: [set-version, download-customization]
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.set-version.outputs.version }}
    strategy:
      matrix:
        arch: [win-x86, win-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.ref || '' }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Download Customization Config
        if: needs.download-customization.outputs.has_config == 'true'
        uses: ./.github/actions/download-artifact
        with:
          name: CustomizationConfig
          path: ${{ runner.temp }}/customization
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Apply Branding
        id: branding
        uses: ./.github/actions/apply-branding
        with:
          source-dir: '.'
          customization-config-path: ${{ needs.download-customization.outputs.has_config == 'true' && format('{0}/customization/customization.json', runner.temp) || '' }}
          version: ${{ needs.set-version.outputs.version }}

      # ===== Build Windows =====
      - name: Build Windows Bundle (${{ matrix.arch }})
        uses: ./.github/actions/build-windows-bundle
        with:
          source-dir: '.'
          arch: ${{ matrix.arch }}
          version: ${{ needs.set-version.outputs.version }}
          azure-client-id: ${{ secrets.CODESIGN_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-key-vault-uri: ${{ secrets.CODESIGN_KEYVAULT_URI }}
          azure-key-vault-certificate-name: ${{ secrets.CODESIGN_KEYVAULT_CERT_NAME }}
          signing-description-url: ${{ vars.CODESIGN_DESCRIPTION_URL }}

      - name: Upload Downloads (${{ matrix.arch }})
        uses: ./.github/actions/upload-artifact
        with:
          name: Downloads-${{ matrix.arch }}
          path: ControlR.Web.Server\wwwroot\downloads\${{ matrix.arch }}\
          retention-days: ${{ env.RETENTION_DAYS_ARTIFACTS }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

  build-linux-binaries:
    name: Linux Build
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}
    needs: [set-version, download-customization]
    env:
      VERSION: ${{ needs.set-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.ref || '' }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install macOS workload
        run: dotnet workload install macos

      - name: Download Customization Config
        if: needs.download-customization.outputs.has_config == 'true'
        uses: ./.github/actions/download-artifact
        with:
          name: CustomizationConfig
          path: ${{ runner.temp }}/customization
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Apply Branding
        id: branding
        uses: ./.github/actions/apply-branding
        with:
          source-dir: '.'
          customization-config-path: ${{ needs.download-customization.outputs.has_config == 'true' && format('{0}/customization/customization.json', runner.temp) || '' }}
          version: ${{ needs.set-version.outputs.version }}

      - name: Build Linux Bundle
        uses: ./.github/actions/build-linux-bundle
        with:
          source-dir: '.'
          arch: linux-x64
          version: ${{ needs.set-version.outputs.version }}

      - name: Upload Downloads (linux-x64)
        uses: ./.github/actions/upload-artifact
        with:
          name: Downloads-linux-x64
          path: ControlR.Web.Server/wwwroot/downloads/linux-x64/
          retention-days: ${{ env.RETENTION_DAYS_ARTIFACTS }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

  build-web-server:
    name: Build Web Server
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Windows"]') || fromJson('["ubuntu-latest"]') }}
    needs:
      [
        set-version,
        download-customization,
        build-windows-binaries,
        build-linux-binaries,
        build-mac-binaries,
      ]
    env:
      VERSION: ${{ needs.set-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.ref || '' }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Download Customization Config
        if: needs.download-customization.outputs.has_config == 'true'
        uses: ./.github/actions/download-artifact
        with:
          name: CustomizationConfig
          path: ${{ runner.temp }}/customization
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Apply Branding
        id: branding
        uses: ./.github/actions/apply-branding
        with:
          source-dir: '.'
          customization-config-path: ${{ needs.download-customization.outputs.has_config == 'true' && format('{0}/customization/customization.json', runner.temp) || '' }}
          version: ${{ env.VERSION }}

      - name: Download Runtime Artifacts (win-x86)
        uses: ./.github/actions/download-artifact
        with:
          name: Downloads-win-x86
          path: ControlR.Web.Server/wwwroot/downloads/win-x86/
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Download Runtime Artifacts (win-x64)
        uses: ./.github/actions/download-artifact
        with:
          name: Downloads-win-x64
          path: ControlR.Web.Server/wwwroot/downloads/win-x64/
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Download Runtime Artifacts (linux-x64)
        uses: ./.github/actions/download-artifact
        with:
          name: Downloads-linux-x64
          path: ControlR.Web.Server/wwwroot/downloads/linux-x64/
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Download Runtime Artifacts (macOS ARM64)
        uses: ./.github/actions/download-artifact
        with:
          name: Downloads-osx-arm64
          path: ControlR.Web.Server/wwwroot/downloads/osx-arm64/
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Download Runtime Artifacts (macOS x64)
        uses: ./.github/actions/download-artifact
        with:
          name: Downloads-osx-x64
          path: ControlR.Web.Server/wwwroot/downloads/osx-x64/
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Create Version.txt
        shell: pwsh
        run: |
          Set-Content -Path "ControlR.Web.Server/wwwroot/downloads/Version.txt" -Value $env:VERSION -Force -Encoding UTF8

      - name: Copy Release Notes
        shell: pwsh
        run: |
          if (Test-Path ".release-notes/current.md") {
            Copy-Item -Path ".release-notes/current.md" -Destination "ControlR.Web.Server/wwwroot/downloads/release-notes.md" -Force
          } else {
            Write-Host "No .release-notes/current.md found. Creating placeholder."
            @"
          ## $env:VERSION

          _No release notes available yet._
          "@ | Set-Content -Path "ControlR.Web.Server/wwwroot/downloads/release-notes.md" -Encoding UTF8
          }

      - name: Resolve Target Runtimes
        id: runtimes
        shell: pwsh
        run: |
          $runtime = '${{ inputs.server_runtime }}'

          $ResolvedRuntimes = switch ($runtime) {
            'linux-x64'       { @('linux-x64') }
            'linux-arm64'     { @('linux-arm64') }
            'linux-multiarch' { @('linux-x64', 'linux-arm64') }
            'win-x64'         { @('win-x64') }
            default { throw "Unsupported server_runtime '$runtime'." }
          }

          $json = ConvertTo-Json -InputObject @($ResolvedRuntimes) -Compress
          "rids=$json" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved server_runtime '$runtime' to $json"

      - name: Build Web Server
        shell: pwsh
        run: |
          $runtimes = ConvertFrom-Json '${{ steps.runtimes.outputs.rids }}'
          foreach ($runtime in $runtimes) {
            $OutputDir = "ControlR.Web.Server/bin/publish/$runtime"
            New-Item -Path $OutputDir -ItemType Directory -Force | Out-Null
            Write-Host "Publishing ControlR.Web.Server for $runtime..."
            dotnet publish ControlR.Web.Server/ -p:ExcludeApp_Data=true --runtime $runtime --configuration Release -p:Version=$env:VERSION -p:FileVersion=$env:VERSION --output $OutputDir --self-contained true
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed for $runtime with exit code $LASTEXITCODE."
            }
          }

      - name: Verify Download Artifacts
        shell: pwsh
        run: |
          $runtimes = ConvertFrom-Json '${{ steps.runtimes.outputs.rids }}'
          $RequiredPaths = @(
            "wwwroot/downloads/Version.txt",
            "wwwroot/downloads/release-notes.md",
            "wwwroot/downloads/win-x86/$env:BRAND_KEY.Agent.Installer.exe",
            "wwwroot/downloads/win-x64/$env:BRAND_KEY.Agent.Installer.exe",
            "wwwroot/downloads/win-x86/$env:BRAND_KEY.Agent.bundle.zip",
            "wwwroot/downloads/win-x64/$env:BRAND_KEY.Agent.bundle.zip",
            "wwwroot/downloads/linux-x64/$env:BRAND_KEY.Agent.Installer",
            "wwwroot/downloads/linux-x64/$env:BRAND_KEY.Agent.bundle.zip",
            "wwwroot/downloads/osx-arm64/$env:BRAND_KEY.Agent.Installer",
            "wwwroot/downloads/osx-arm64/$env:BRAND_KEY.Agent.bundle.zip",
            "wwwroot/downloads/osx-x64/$env:BRAND_KEY.Agent.Installer",
            "wwwroot/downloads/osx-x64/$env:BRAND_KEY.Agent.bundle.zip",
            "wwwroot/lib/monaco-editor/min/vs/editor/editor.main.js",
            "novnc/vnc.html"
          )
          foreach ($runtime in $runtimes) {
            foreach ($RequiredPath in $RequiredPaths) {
              $TestPath = "ControlR.Web.Server/bin/publish/$runtime/$RequiredPath"
              if (!(Test-Path $TestPath)) {
                Write-Error "$TestPath not found."
                exit 1
              }
            }
          }

      # The authoritative record of what this build produced. Publishing workflows read it
      # through .github/actions/get-build-metadata instead of re-deriving version and
      # prerelease state from the payload. Add properties here as the need arises.
      - name: Write Build Metadata
        shell: pwsh
        env:
          PRERELEASE: ${{ needs.set-version.outputs.prerelease }}
          SERVER_RIDS: ${{ steps.runtimes.outputs.rids }}
        run: |
          $PrereleaseValue = "$env:PRERELEASE".Trim().ToLowerInvariant()
          if ($PrereleaseValue -notin @('true', 'false')) {
            throw "prerelease input must be true or false; got '$env:PRERELEASE'."
          }

          $Metadata = [ordered]@{
            version    = $env:VERSION
            prerelease = $PrereleaseValue -eq 'true'
            serverRids = @(ConvertFrom-Json $env:SERVER_RIDS)
          }

          New-Item -Path build-metadata -ItemType Directory -Force | Out-Null
          $Metadata | ConvertTo-Json -Depth 5 | Set-Content -Path build-metadata/build_metadata.json -Encoding utf8
          Get-Content -Path build-metadata/build_metadata.json

      - name: Upload Build Metadata
        uses: ./.github/actions/upload-artifact
        with:
          name: BuildMetadata
          path: build-metadata/build_metadata.json
          retention-days: ${{ env.RETENTION_DAYS_ARTIFACTS }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Upload Server
        uses: ./.github/actions/upload-artifact
        with:
          name: Server
          path: ControlR.Web.Server/bin/publish
          retention-days: ${{ env.RETENTION_DAYS_ARTIFACTS }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Upload docker-compose
        uses: ./.github/actions/upload-artifact
        with:
          name: DockerCompose
          path: docker-compose/docker-compose.yml
          retention-days: ${{ env.RETENTION_DAYS_ARTIFACTS }}
          artifact-host: ${{ inputs.use_local_storage && vars.ARTIFACT_HOST || '' }}
          artifact-base-path: ${{ inputs.use_local_storage && vars.ARTIFACT_BASE_PATH || '' }}

      - name: Print Build Summary
        shell: pwsh
        env:
          GIT_REF: ${{ github.ref }}
          SERVER_RUNTIME: ${{ inputs.server_runtime }}
          SERVER_RIDS: ${{ steps.runtimes.outputs.rids }}
          USE_SELF_HOSTED_RUNNERS: ${{ inputs.use_self_hosted_runners }}
          USE_LOCAL_STORAGE: ${{ inputs.use_local_storage }}
          CUSTOMIZATION_CONFIG_URL: ${{ inputs.customization_config_url }}
          PRERELEASE: ${{ needs.set-version.outputs.prerelease }}
        run: |
          $Summary = @(
            "## Build Summary",
            "**Version:** v$env:VERSION",
            "**Git Ref:** $env:GIT_REF",
            "**Server Runtime:** $env:SERVER_RUNTIME",
            "**Resolved Server Runtimes:** $env:SERVER_RIDS",
            "**Use Self-Hosted Runners:** $env:USE_SELF_HOSTED_RUNNERS",
            "**Use Local Storage for Artifacts:** $env:USE_LOCAL_STORAGE",
            "**Customization Config URL:** $env:CUSTOMIZATION_CONFIG_URL",
            "**Pre-release:** $env:PRERELEASE"
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $Summary
