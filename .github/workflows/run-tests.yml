name: Run Tests

on:
  workflow_call:
    inputs:
      use_self_hosted_runners:
        description: Use self-hosted runners.
        required: false
        default: false
        type: boolean

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  verify-openapi-docs-current:
    name: OpenAPI Document Freshness
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      # Microsoft.Extensions.ApiDescription.Server is referenced for Debug only, and the test jobs
      # below build Release. Without an explicit Debug build here the documents are never
      # regenerated and the comparison below would pass against the stale committed copies.
      # The committed copies are deleted first so that a build which stops generating documents
      # fails the next step instead of comparing the committed files against themselves.
      - name: Regenerate OpenAPI documents
        run: |
          # SilentlyContinue so a repository missing these documents reaches the clearer
          # "the build did not produce" failure below instead of dying here on a raw Remove-Item error.
          Remove-Item -Path "ControlR.Web.Server/ControlR.Web.Server_*.json" -ErrorAction SilentlyContinue
          dotnet build ControlR.Web.Server/ControlR.Web.Server.csproj -c Debug --verbosity quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to regenerate the OpenAPI documents."
          }

      - name: Fail if the committed documents are stale
        run: |
          $documents = @(
            "ControlR.Web.Server/ControlR.Web.Server_internal.json",
            "ControlR.Web.Server/ControlR.Web.Server_v1.json"
          )

          foreach ($document in $documents) {
            if (-not (Test-Path $document)) {
              throw "The build did not produce $document, so the committed documents cannot be verified."
            }
          }

          # git diff ignores untracked files, so a document that was never committed would pass while nothing checks it.
          $untracked = @(git ls-files --others --exclude-standard -- "ControlR.Web.Server/ControlR.Web.Server_*.json")
          if ($untracked.Count -gt 0) {
            Write-Host "::error::The following generated OpenAPI documents are not committed: $($untracked -join ', ')"
            exit 1
          }

          git --no-pager diff --exit-code -- $documents
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::The committed OpenAPI documents are out of date with current routing and annotations."
            Write-Host "Regenerate and commit them with:"
            Write-Host "  dotnet build ControlR.Web.Server/ControlR.Web.Server.csproj -c Debug"
            exit 1
          }

  run-linux-tests:
    name: Linux Tests
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Linux"]') || fromJson('["ubuntu-latest"]') }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install macOS workload
        run: dotnet workload install macos

      - name: Restore
        run: dotnet restore

      - name: Build Test Projects
        run: |
          $excludedProjects = @(
            "ControlR.DesktopClient.Tests.csproj",
            "ControlR.DesktopClient.Mac.Tests.csproj",
            "ControlR.DesktopClient.Windows.Tests.csproj",
            "ControlR.Web.Server.UITests.csproj"
          )

          $testProjects = Get-ChildItem -Path "Tests" -Recurse -Filter "*.csproj" |
            Where-Object { $_.Name -like "*.Tests.csproj" -and $_.Name -notin $excludedProjects } |
            Sort-Object FullName

          if ($testProjects.Count -eq 0) {
            throw "No platform-agnostic test projects were found under Tests/."
          }

          foreach ($project in $testProjects) {
            Write-Host "Building $($project.FullName)..."
            dotnet build $project.FullName -c Release
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for $($project.FullName)."
            }
          }

      - name: Run Tests
        run: |
          $excludedProjects = @(
            "ControlR.DesktopClient.Tests.csproj",
            "ControlR.DesktopClient.Mac.Tests.csproj",
            "ControlR.DesktopClient.Windows.Tests.csproj",
            "ControlR.Web.Server.UITests.csproj"
          )

          $testProjects = Get-ChildItem -Path "Tests" -Recurse -Filter "*.csproj" |
            Where-Object { $_.Name -like "*.Tests.csproj" -and $_.Name -notin $excludedProjects } |
            Sort-Object FullName

          foreach ($project in $testProjects) {
            Write-Host "Running $($project.FullName)..."
            dotnet run --project $project.FullName -c Release --no-build --no-restore
            if ($LASTEXITCODE -ne 0) {
              throw "Test execution failed for $($project.FullName)."
            }
          }

  run-windows-desktop-tests:
    name: Windows Tests
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","Windows"]') || fromJson('["windows-latest"]') }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install macOS workload
        run: dotnet workload install macos

      - name: Build Desktop Tests
        run: |
          $testProjects = @(
            "Tests/ControlR.DesktopClient.Tests/ControlR.DesktopClient.Tests.csproj",
            "Tests/ControlR.DesktopClient.Windows.Tests/ControlR.DesktopClient.Windows.Tests.csproj"
          )

          foreach ($project in $testProjects) {
            Write-Host "Building $project..."
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for $project."
            }
          }

      - name: Run Desktop Tests
        run: |
          $testProjects = @(
            "Tests/ControlR.DesktopClient.Tests/ControlR.DesktopClient.Tests.csproj",
            "Tests/ControlR.DesktopClient.Windows.Tests/ControlR.DesktopClient.Windows.Tests.csproj"
          )

          foreach ($project in $testProjects) {
            Write-Host "Running $project on Windows..."
            dotnet run --project $project -c Release --no-build --no-restore
            if ($LASTEXITCODE -ne 0) {
              throw "Test execution failed for $project."
            }
          }

  run-macos-desktop-tests:
    name: macOS Tests
    runs-on: ${{ inputs.use_self_hosted_runners && fromJson('["self-hosted","macOS"]') || fromJson('["macos-26"]') }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - name: Setup .NET
        if: inputs.use_self_hosted_runners == false
        uses: ./.github/actions/setup-dotnet

      - name: Install macOS workload
        if: inputs.use_self_hosted_runners == false
        run: dotnet workload install macos

      - name: Build Desktop Tests
        run: |
          $testProjects = @(
            "Tests/ControlR.DesktopClient.Tests/ControlR.DesktopClient.Tests.csproj",
            "Tests/ControlR.DesktopClient.Mac.Tests/ControlR.DesktopClient.Mac.Tests.csproj"
          )

          foreach ($project in $testProjects) {
            Write-Host "Building $project for osx-arm64..."
            dotnet build $project -c Release -r osx-arm64 --self-contained
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for $project."
            }
          }

      - name: Run Desktop Tests
        run: |
          $testProjects = @(
            "Tests/ControlR.DesktopClient.Tests/ControlR.DesktopClient.Tests.csproj",
            "Tests/ControlR.DesktopClient.Mac.Tests/ControlR.DesktopClient.Mac.Tests.csproj"
          )

          foreach ($project in $testProjects) {
            Write-Host "Running $project on macOS (osx-arm64)..."
            dotnet run --project $project -c Release -r osx-arm64 --self-contained --no-build --no-restore
            if ($LASTEXITCODE -ne 0) {
              throw "Test execution failed for $project."
            }
          }
