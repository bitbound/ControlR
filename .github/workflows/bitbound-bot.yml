name: opencode

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request:
    types: [opened, reopened]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  bitbound-bot:
    runs-on: ${{ fromJson('["self-hosted","Linux"]') }}
    if: |
      github.repository == 'bitbound/ControlR-dev' &&
      github.actor == 'bitbound' &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name) ||
        ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          contains(github.event.comment.body, '/bb'))
      )
    timeout-minutes: 30
    concurrency:
      group: bitbound-bot-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BBB_CLIENT_ID }}
          private-key: ${{ secrets.BBB_PRIVATE_KEY }}

      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          model: ${{vars.BBB_MODEL}}
          use_github_token: true
          mentions: "/bb"
