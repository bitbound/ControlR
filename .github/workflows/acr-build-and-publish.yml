name: ACR Build and Publish
run-name: Portal Build (${{ inputs.environment }} | ${{ inputs.sponsor_login }}-slot${{ inputs.slot_number }})

on:
  workflow_dispatch:
    inputs:
      customization_config_url:
        description: "URL to JSON customization config"
        required: true
        type: string
      version:
        description: "Version/ref to build"
        required: true
        type: string
      source_ref:
        description: "Git ref (tag) to build from"
        required: true
        type: string
      image_reference:
        description: "Full ACR image reference (e.g., myregistry.azurecr.io/sponsor/controlr:sponsor-slot1)"
        required: true
        type: string
      sponsor_login:
        description: "Sponsor GitHub login"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: number
      server_runtime:
        description: "Server target runtime (linux-x64 or linux-arm64)"
        required: false
        type: choice
        default: "linux-x64"
        options:
          - linux-x64
          - linux-arm64
      environment:
        description: "Target environment (dev or prod)"
        required: false
        type: choice
        default: "dev"
        options:
          - dev
          - prod

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      customization_config_url: ${{ inputs.customization_config_url }}
      version: ${{ inputs.version }}
      ref: ${{ inputs.source_ref }}
      server_runtime: ${{ inputs.server_runtime }}
      skip_version_increment: true
      use_self_hosted_runners: true
      use_local_storage: true
      retention_days_artifacts: 1
      build_nugets: false
      notarize_mac_bundle: true
      prerelease: false
      run_tests: false
    secrets: inherit

  # A "native" job (runs-on + steps) is intentionally kept in this workflow. If the
  # publish-acr reusable-call job ever fails to instantiate again (e.g. an input
  # resolution error), the error would otherwise be invisible in the job list. This
  # guarantees a native job runs so template-resolution errors surface on the run.
  echo-build-summary:
    name: Print Build Summary
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Echo Build Summary
        run: |
          echo "Run ID: ${{ github.run_id }}"
          echo "Sponsor Login: ${{ inputs.sponsor_login }}"
          echo "Slot Number: ${{ inputs.slot_number }}"
          echo "Image Reference: ${{ inputs.image_reference }}"
          echo "Environment: ${{ inputs.environment }}"

  publish-acr:
    name: Publish to ACR
    needs: build
    if: ${{ always() }}
    concurrency:
      group: acr-publish-${{ inputs.sponsor_login }}-slot${{ inputs.slot_number }}
      cancel-in-progress: false
    uses: ./.github/workflows/publish-acr.yml
    with:
      run_id: ${{ github.run_id }}
      sponsor_login: ${{ inputs.sponsor_login }}
      slot_number: ${{ inputs.slot_number }}
      image_reference: ${{ inputs.image_reference }}
      server_runtime: ${{ inputs.server_runtime }}
      environment: ${{ inputs.environment }}
      use_local_storage: true
      use_self_hosted_runners: true
    secrets: inherit
