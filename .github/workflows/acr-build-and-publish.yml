name: ACR Build and Publish
run-name: Portal Build (${{ inputs.environment }} | ${{ inputs.sponsor_login }}-slot${{ inputs.slot_number }} | ${{ inputs.delivery_format }})

on:
  workflow_dispatch:
    inputs:
      customization_config_url:
        description: "URL to JSON customization config"
        required: true
        type: string
      version:
        description: "Version/ref to build"
        required: true
        type: string
      source_ref:
        description: "Git ref (tag) to build from"
        required: true
        type: string
      image_reference:
        description: "Full ACR image reference (e.g., myregistry.azurecr.io/sponsor/controlr:sponsor-slot1). Required for docker delivery, ignored for zip."
        required: false
        type: string
      artifact_blob_key:
        description: "Blob key for the server ZIP within the slot-builds container. Required for zip delivery, ignored for docker."
        required: false
        type: string
      sponsor_login:
        description: "Sponsor GitHub login"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: number
      server_runtime:
        description: "Server target runtime"
        required: false
        type: choice
        default: "linux-x64"
        options:
          - linux-x64
          - linux-arm64
          - win-x64
      delivery_format:
        description: "How the built server is delivered (container image or ZIP artifact)"
        required: false
        type: choice
        default: "docker"
        options:
          - docker
          - zip
      environment:
        description: "Target environment (dev or prod)"
        required: false
        type: choice
        default: "dev"
        options:
          - dev
          - prod

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  # Fails fast on input combinations that would waste an expensive build (e.g. a manual
  # win-x64 + docker dispatch, which publish-acr can only reject after the build ends).
  # The portal blocks the same combinations server-side.
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate delivery format and runtime
        shell: pwsh
        env:
          DELIVERY_FORMAT: ${{ inputs.delivery_format }}
          SERVER_RUNTIME: ${{ inputs.server_runtime }}
          ARTIFACT_BLOB_KEY: ${{ inputs.artifact_blob_key }}
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
        run: |
          if ($env:DELIVERY_FORMAT -eq 'docker' -and $env:SERVER_RUNTIME -eq 'win-x64') {
            throw "server_runtime win-x64 requires delivery_format zip; container delivery only supports Linux runtimes."
          }

          if ($env:DELIVERY_FORMAT -eq 'zip' -and -not $env:ARTIFACT_BLOB_KEY) {
            throw "artifact_blob_key is required for zip delivery."
          }

          if ($env:DELIVERY_FORMAT -eq 'docker' -and -not $env:IMAGE_REFERENCE) {
            throw "image_reference is required for docker delivery."
          }

          Write-Host "Inputs OK (format=$env:DELIVERY_FORMAT, runtime=$env:SERVER_RUNTIME)"

  build:
    name: Build
    needs: validate-inputs
    uses: ./.github/workflows/build.yml
    with:
      customization_config_url: ${{ inputs.customization_config_url }}
      version: ${{ inputs.version }}
      ref: ${{ inputs.source_ref }}
      server_runtime: ${{ inputs.server_runtime }}
      skip_version_increment: true
      use_self_hosted_runners: false
      use_local_storage: false
      retention_days_artifacts: 1
      build_nugets: false
      notarize_mac_bundle: true
      prerelease: false
      run_tests: false
    secrets: inherit

  # A "native" job (runs-on + steps) is intentionally kept in this workflow. If the
  # publish-acr reusable-call job ever fails to instantiate again (e.g. an input
  # resolution error), the error would otherwise be invisible in the job list. This
  # guarantees a native job runs so template-resolution errors surface on the run.
  echo-build-summary:
    name: Print Build Summary
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Echo Build Summary
        shell: pwsh
        env:
          SPONSOR_LOGIN: ${{ inputs.sponsor_login }}
          SLOT_NUMBER: ${{ inputs.slot_number }}
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
          DELIVERY_FORMAT: ${{ inputs.delivery_format }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          Write-Host "Run ID: $env:GITHUB_RUN_ID"
          Write-Host "Sponsor Login: $env:SPONSOR_LOGIN"
          Write-Host "Slot Number: $env:SLOT_NUMBER"
          Write-Host "Image Reference: $env:IMAGE_REFERENCE"
          Write-Host "Delivery Format: $env:DELIVERY_FORMAT"
          Write-Host "Environment: $env:ENVIRONMENT"

  publish-acr:
    name: Publish to ACR
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' && inputs.delivery_format == 'docker' }}
    concurrency:
      group: acr-publish-${{ inputs.sponsor_login }}-slot${{ inputs.slot_number }}
      cancel-in-progress: false
    uses: ./.github/workflows/publish-acr.yml
    with:
      run_id: ${{ github.run_id }}
      sponsor_login: ${{ inputs.sponsor_login }}
      slot_number: ${{ inputs.slot_number }}
      image_reference: ${{ inputs.image_reference }}
      server_runtime: ${{ inputs.server_runtime }}
      environment: ${{ inputs.environment }}
      use_local_storage: false
      use_self_hosted_runners: false
    secrets: inherit

  publish-zip:
    name: Publish Server ZIP
    needs: build
    if: ${{ always() && !cancelled() && needs.build.result != 'skipped' && inputs.delivery_format == 'zip' }}
    concurrency:
      group: zip-publish-${{ inputs.sponsor_login }}-slot${{ inputs.slot_number }}
      cancel-in-progress: false
    uses: ./.github/workflows/publish-zip.yml
    with:
      run_id: ${{ github.run_id }}
      sponsor_login: ${{ inputs.sponsor_login }}
      slot_number: ${{ inputs.slot_number }}
      artifact_blob_key: ${{ inputs.artifact_blob_key }}
      server_runtime: ${{ inputs.server_runtime }}
      environment: ${{ inputs.environment }}
      use_local_storage: false
      use_self_hosted_runners: false
    secrets: inherit
