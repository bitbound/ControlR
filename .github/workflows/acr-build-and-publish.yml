name: ACR Build and Publish
run-name: ACR Build (${{ inputs.image_reference }})

on:
  workflow_dispatch:
    inputs:
      customization_config_url:
        description: "URL to JSON customization config"
        required: true
        type: string
      version:
        description: "Version/ref to build"
        required: true
        type: string
      image_reference:
        description: "Full ACR image reference (e.g., myregistry.azurecr.io/sponsor/controlr:sponsor-slot1)"
        required: true
        type: string
      sponsor_login:
        description: "Sponsor GitHub login"
        required: true
        type: string
      slot_number:
        description: "Sponsor build slot number"
        required: true
        type: number

permissions:
  actions: write
  contents: read

env:
  BUILD_WORKFLOW: build.yml

jobs:
  dispatch-and-build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.wait.outputs.run_id }}
    steps:
      - name: Snapshot existing build runs
        id: snapshot
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $repo = "$env:REPO"
          $uri = "https://api.github.com/repos/$repo/actions/workflows/$env:BUILD_WORKFLOW/runs?per_page=100"
          $existing = Invoke-RestMethod -Uri $uri -Headers $headers
          $ids = $existing.workflow_runs | ForEach-Object { $_.id.ToString() }
          $ids -join "," | Set-Content -Path "$env:RUNNER_TEMP/existing-runs.txt" -Encoding utf8
          Write-Host "Snapshot recorded ($($ids.Count) existing runs)"

      - name: Dispatch build.yml
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          CONFIG_URL: ${{ inputs.customization_config_url }}
          VERSION: ${{ inputs.version }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }

          $body = @{
            ref    = "$env:REF_NAME"
            inputs = @{
              customization_config_url = "$env:CONFIG_URL"
              version                  = "$env:VERSION"
              use_self_hosted_runners  = "true"
              use_local_storage        = "true"
              retention_days_artifacts = "1"
              build_nugets             = "false"
              notarize_mac_bundle      = "false"
              prerelease               = "false"
              run_tests                = "false"
            }
          } | ConvertTo-Json -Depth 3

          $repo = "$env:REPO"
          $uri = "https://api.github.com/repos/$repo/actions/workflows/$env:BUILD_WORKFLOW/dispatches"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Body $body -ContentType "application/json"
          Write-Host "Dispatched $env:BUILD_WORKFLOW"

      - name: Wait for dispatched build run
        id: wait
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $repo = "$env:REPO"
          $existing = ((Get-Content "$env:RUNNER_TEMP/existing-runs.txt" -Raw).Trim() -split ',')

          $run = $null
          $deadline = (Get-Date).AddHours(2)

          # Poll for a run that did not exist before our dispatch.
          while ((Get-Date) -lt $deadline -and -not $run) {
            Start-Sleep -Seconds 15
            $uri = "https://api.github.com/repos/$repo/actions/workflows/$env:BUILD_WORKFLOW/runs?per_page=100"
            $runs = Invoke-RestMethod -Uri $uri -Headers $headers
            $run = $runs.workflow_runs |
              Where-Object { $_.head_branch -eq "$env:REF_NAME" -and $_.id.ToString() -notin $existing } |
              Select-Object -First 1
            if ($run) { Write-Host "Found dispatched run: $($run.id)" }
          }

          if (-not $run) {
            Write-Error "Could not find the dispatched build run. Check that build.yml exists on the $env:REF_NAME branch."
            exit 1
          }

          $runId = $run.id

          # Wait for the run to complete.
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 20
            $uri = "https://api.github.com/repos/$repo/actions/runs/$runId"
            $status = Invoke-RestMethod -Uri $uri -Headers $headers
            if ($status.status -eq "completed") {
              Write-Host "Run $runId completed with conclusion: $($status.conclusion)"
              if ($status.conclusion -ne "success") {
                Write-Error "Build run failed with conclusion: $($status.conclusion)"
                exit 1
              }
              break
            }
          }

          if ($status.status -ne "completed") {
            Write-Error "Build run $runId did not complete within 2 hours."
            exit 1
          }

          echo "run_id=$runId" >> $env:GITHUB_OUTPUT

  publish-acr:
    name: Publish to ACR
    needs: dispatch-and-build
    uses: ./.github/workflows/publish-acr.yml
    with:
      run_id: ${{ needs.dispatch-and-build.outputs.run_id }}
      sponsor_login: ${{ inputs.sponsor_login }}
      slot_number: ${{ inputs.slot_number }}
      image_reference: ${{ inputs.image_reference }}
      use_local_storage: true
      use_self_hosted_runners: true
    secrets: inherit
